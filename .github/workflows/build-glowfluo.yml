name: Build GlowFluo Photo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract GlowFluo project
        shell: bash
        run: |
          set -e

          ZIP="GlowFluoPhoto_v1.zip"

          echo "======================================"
          echo "EXTRACTING GLOWFLUO PHOTO"
          echo "======================================"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found"
            exit 1
          fi

          rm -rf GlowFluoPhoto

          unzip -q "$ZIP"

          echo "Extracted files:"
          find GlowFluoPhoto -maxdepth 3 -type f | sort

