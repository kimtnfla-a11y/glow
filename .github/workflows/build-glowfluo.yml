name: Build GlowFluo Photo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find and extract GlowFluoPhoto ZIP
        shell: bash
        run: |
          set -e

          ZIP=""
          for candidate in GlowFluoPhoto_FINAL.zip GlowFluoPhoto_fixed_v2.zip GlowFluoPhoto_v1.zip; do
            if [ -f "$candidate" ]; then
              ZIP="$candidate"
              break
            fi
          done

          if [ -z "$ZIP" ]; then
            ZIP="$(find . -maxdepth 2 -type f -iname 'GlowFluoPhoto*.zip' | head -n 1 || true)"
          fi

          if [ -z "$ZIP" ]; then
            echo "ERROR: GlowFluoPhoto ZIP was not found in the repository root."
            echo "Files currently in repository:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          rm -rf GlowFluoPhoto
          unzip -q "$ZIP" -d .

          if [ ! -f "GlowFluoPhoto/settings.gradle" ] && [ ! -f "GlowFluoPhoto/settings.gradle.kts" ]; then
            echo "ERROR: GlowFluoPhoto/settings.gradle was not found after extraction."
            echo "Extracted structure:"
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Project ready:"
          find GlowFluoPhoto -maxdepth 4 -type f | sort

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          gradle --no-daemon --stacktrace --warning-mode all             -p GlowFluoPhoto             :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK="GlowFluoPhoto/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find GlowFluoPhoto -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK created successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlowFluoPhoto-debug
          path: GlowFluoPhoto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
