name: Build GlowFluo Photo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "GLOWFLUO PHOTO BUILD"
          echo "======================================"

          if [ ! -d "GlowFluoPhoto" ]; then
            echo "ERROR: GlowFluoPhoto directory not found."
            echo "Current directory:"
            pwd
            echo "Files:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          if [ ! -f "GlowFluoPhoto/gradlew" ]; then
            echo "ERROR: GlowFluoPhoto/gradlew not found."
            find GlowFluoPhoto -maxdepth 3 -type f | sort
            exit 1
          fi

          if [ ! -f "GlowFluoPhoto/settings.gradle" ] && \
             [ ! -f "GlowFluoPhoto/settings.gradle.kts" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          chmod +x GlowFluoPhoto/gradlew

          echo ""
          echo "Project structure:"
          find GlowFluoPhoto -maxdepth 3 -type f | sort

      - name: Clean previous build
        shell: bash
        run: |
          set -e
          cd GlowFluoPhoto
          ./gradlew clean

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd GlowFluoPhoto

          echo "======================================"
          echo "BUILDING DEBUG APK"
          echo "======================================"

          ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="GlowFluoPhoto/app/build/outputs/apk/debug/app-debug.apk"

          echo "======================================"
          echo "CHECKING APK"
          echo "======================================"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo ""
            echo "Available APK files:"
            find GlowFluoPhoto -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlowFluoPhoto-debug
          path: GlowFluoPhoto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14



