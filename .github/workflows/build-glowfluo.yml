name: Build GlowFluo Photo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project
        run: |
          unzip -o GlowFluoPhoto_v1.zip
          echo "PROJECT FILES:"
          find GlowFluoPhoto -type f | sort

      - name: Build APK
        run: |
          cd GlowFluoPhoto
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlowFluoPhoto-debug
          path: GlowFluoPhoto/app/build/outputs/apk/debug/app-debug.apk
