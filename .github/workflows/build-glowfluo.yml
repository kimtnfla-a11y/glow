name: Build GlowFluo Photo APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'GlowFluoPhoto_v1.zip'
      - '.github/workflows/build-glowfluo.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          set -e
          ZIP="GlowFluoPhoto_v1.zip"
          test -f "$ZIP"
          rm -rf /tmp/glowfluo
          mkdir -p /tmp/glowfluo
          unzip -q "$ZIP" -d /tmp/glowfluo

          # The uploaded ZIP may contain a top-level project folder.
          if [ -f /tmp/glowfluo/settings.gradle ]; then
            PROJECT=/tmp/glowfluo
          else
            PROJECT=$(find /tmp/glowfluo -maxdepth 3 -name settings.gradle -type f -print -quit | xargs -r dirname)
          fi

          test -n "${PROJECT:-}"
          test -f "$PROJECT/settings.gradle"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: |
          cd "$PROJECT"
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlowFluoPhoto-debug
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
