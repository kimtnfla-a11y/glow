name: Build GlowFluo Photo APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"

      - name: Extract GlowFluoPhoto project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="GlowFluoPhoto_FINAL.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found in repository root."
            echo "Repository files:"
            find . -maxdepth 3 -type f -not -path './.git/*' | sort
            exit 1
          fi

          rm -rf "$RUNNER_TEMP/glowfluo"
          mkdir -p "$RUNNER_TEMP/glowfluo"

          unzip -q "$ZIP" -d "$RUNNER_TEMP/glowfluo"

          PROJECT_DIR="$(find "$RUNNER_TEMP/glowfluo" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No settings.gradle or settings.gradle.kts was found inside $ZIP."
            echo "ZIP contents:"
            unzip -l "$ZIP"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project:"
          echo "$PROJECT_DIR"

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Gradle version:"
          gradle --version

          echo "Project files:"
          find . -maxdepth 3 -type f | sort

          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK was not generated."
            find "$PROJECT_DIR" -type f -name '*.apk' -print
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlowFluoPhoto-debug
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 14
