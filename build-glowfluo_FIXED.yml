name: Build GlowFluo Photo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK path was not found."
            exit 1
          fi

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi

          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "Using SDK: $SDK_ROOT"
          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK preparation complete."

      - name: Find and extract GlowFluoPhoto ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file was found in the repository root."
            echo "Root files:"
            find . -maxdepth 2 -type f -print | sort
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf "$RUNNER_TEMP/glowfluo-src"
          mkdir -p "$RUNNER_TEMP/glowfluo-src"

          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/glowfluo-src"

          PROJECT_DIR="$(find "$RUNNER_TEMP/glowfluo-src" -name settings.gradle -type f -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find "$RUNNER_TEMP/glowfluo-src" -name settings.gradle.kts -type f -print -quit | xargs -r dirname)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle was not found inside the ZIP."
            echo "ZIP contents:"
            find "$RUNNER_TEMP/glowfluo-src" -maxdepth 5 -type f -print | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found at: $PROJECT_DIR"

      - name: Download Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_VERSION="8.11.1"
          GRADLE_DIR="$RUNNER_TEMP/gradle-$GRADLE_VERSION"
          GRADLE_ZIP="$RUNNER_TEMP/gradle-$GRADLE_VERSION-bin.zip"

          if [ ! -x "$GRADLE_DIR/bin/gradle" ]; then
            curl -fsSL \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -o "$GRADLE_ZIP"

            rm -rf "$GRADLE_DIR" "$RUNNER_TEMP/gradle-$GRADLE_VERSION"
            unzip -q "$GRADLE_ZIP" -d "$RUNNER_TEMP"

            mv "$RUNNER_TEMP/gradle-$GRADLE_VERSION" "$GRADLE_DIR"
          fi

          echo "GRADLE_BIN=$GRADLE_DIR/bin/gradle" >> "$GITHUB_ENV"
          "$GRADLE_DIR/bin/gradle" --version

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING GLOWFLUO PHOTO"
          echo "======================================"

          "$GRADLE_BIN" \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK was not created."
            find "$PROJECT_DIR/app/build/outputs" -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "APK created successfully:"
          ls -lh "$APK"

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$APK" "$GITHUB_WORKSPACE/artifacts/GlowFluoPhoto-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlowFluoPhoto-debug
          path: artifacts/GlowFluoPhoto-debug.apk
          if-no-files-found: error
          retention-days: 14
